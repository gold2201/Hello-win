[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [
    "**/migrations/*.py",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "DJ",  # flake8-django
]
ignore = [
    "DJ001",
]

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
mypy_path = "src"
exclude = [
    "src/apps/.*/migrations/",
    "src/config/settings.py",
]

[tool.django-stubs]
django_settings_module = "src.config.settings"

[[tool.mypy.overrides]]
module = ["django.*", "rest_framework.*", "environ.*"]
ignore_missing_imports = true
